<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Host dashboard</title>
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/admin.css">
<style>
  /* Host page layer on top of the console's own styles. */
  .rail-nav a .tag{margin-left:auto;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    color:#fff;background:var(--neg);padding:2px 6px;font-weight:600}
  .rail-nav a .live-dot{margin-left:auto}
  .rail-me{cursor:default}
  .topbar .sub{font-size:12px;color:var(--muted)}
  .hd-grid{display:grid;grid-template-columns:1fr;gap:20px}
  @media (min-width:1000px){.hd-grid{grid-template-columns:1.6fr 1fr}}
  .hd-bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding:4px 2px 0}
  .hd-bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
  .hd-bars .b{width:100%;max-width:34px;background:var(--purple);min-height:2px}
  .hd-bars .b.neg{background:var(--neg)}
  .hd-bars .x{font-size:10px;color:var(--muted);white-space:nowrap}
  .hd-last .kv b{font-family:var(--mono);font-weight:500}
  .hd-empty{padding:42px 22px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
  .hd-empty b{display:block;color:var(--text);font-size:14px;font-weight:600;margin-bottom:4px}
  .hd-help{font-size:13px;line-height:1.75;color:var(--text-2);max-width:68ch}
  .hd-help h3{font-size:13px;color:var(--text);margin:18px 0 4px;font-weight:600}
  .hd-help h3:first-child{margin-top:0}
  .hd-tabs{display:flex;gap:6px}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
</style>
</head>
<body>
<script src="../assets/js/config.js"></script>
<div id="app"></div>
<script>
(function () {
  /* The host's own page. Signs in against /host on the API with the
     username and password an admin made on the Sessions page, and shows
     that host's sessions only. Nothing here can reach the console. */
  var BASE = ((window.NexasAdminConfig || {}).apiBase || '').replace(/\/+$/, '');
  var KEY = 'nexas-host-token';
  var app = document.getElementById('app');
  var timer = null;
  var data = null;          /* { host, sessions } */
  var range = 'all';        /* sessions view: all | month */

  /* ---------- formatting ---------- */
  var nf0 = new Intl.NumberFormat('en-KE', { maximumFractionDigits: 0 });
  var nf2 = new Intl.NumberFormat('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function money(minor) { return nf2.format((Number(minor) || 0) / 100) + ' KSh'; }
  function short(minor) {
    var v = (Number(minor) || 0) / 100, a = Math.abs(v);
    if (a >= 1e6) return (v / 1e6).toFixed(1) + 'M';
    if (a >= 1e4) return nf0.format(v / 1e3) + 'K';
    return nf0.format(v);
  }
  function count(n) { return nf0.format(Number(n) || 0); }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function day(iso) {
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function time(iso) {
    return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }
  function ranFor(a, b) {
    var mins = Math.max(0, Math.floor(((b ? Date.parse(b) : Date.now()) - Date.parse(a)) / 60000));
    var h = Math.floor(mins / 60);
    return (h ? h + 'h ' : '') + (mins % 60) + 'm';
  }
  function tone(v) { return v >= 0 ? 'pos' : 'neg'; }
  function sum(list, k) { return list.reduce(function (a, s) { return a + (Number(s[k]) || 0); }, 0); }
  function initials(name) {
    return String(name || '?').trim().split(/\s+/).slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); }).join('');
  }

  /* ---------- icons (same strokes as the console) ---------- */
  var ICONS = {
    dash: 'M4 13h7V4H4zM13 20h7v-9h-7zM4 20h7v-4H4zM13 8h7V4h-7z',
    live: 'M12 12v.01|M8.5 8.5a5 5 0 000 7|M15.5 8.5a5 5 0 010 7|M5.5 5.5a9 9 0 000 13|M18.5 5.5a9 9 0 010 13',
    logs: 'M5 4h14v16H5z|M8.5 9h7M8.5 13h7M8.5 17h4',
    chart: 'M4 19h16|M7 16V9M12 16V5M17 16v-5',
    help: 'M9.5 9a2.5 2.5 0 115 .5c0 1.5-2.5 2-2.5 3.5|M12 17v.01',
    out: 'M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4|M16 17l5-5-5-5M21 12H9',
    menu: 'M3 6h18M3 12h18M3 18h18',
    refresh: 'M20 12a8 8 0 11-2.5-5.8|M20 4v4h-4'
  };
  function icon(name, size) {
    var s = size || 16, body = name === 'help' ? '<circle cx="12" cy="12" r="9"></circle>' : '';
    (ICONS[name] || '').split('|').forEach(function (d) { if (d) body += '<path d="' + d + '"></path>'; });
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  }
  function kpi(label, value, note, cls) {
    return '<div class="kpi"><div class="kpi-label">' + label + '</div>' +
      '<div class="kpi-value">' + value + '</div>' +
      (note ? '<div class="kpi-note ' + (cls || '') + '">' + note + '</div>' : '') + '</div>';
  }
  function card(title, body, actions, noPad) {
    return '<section class="card">' +
      (title ? '<div class="card-head"><h2>' + title + '</h2><span class="spacer"></span>' + (actions || '') + '</div>' : '') +
      (noPad ? body : '<div class="card-body">' + body + '</div>') + '</section>';
  }
  function empty(title, text) {
    return '<div class="hd-empty"><b>' + title + '</b>' + text + '</div>';
  }

  /* ---------- API ---------- */
  async function call(path, opts) {
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    var token = localStorage.getItem(KEY);
    if (token) headers.Authorization = 'Bearer ' + token;
    var res;
    try {
      res = await fetch(BASE + path, {
        method: opts.method || 'GET', headers: headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
    } catch (e) {
      throw new Error('Could not reach the server. Check your connection and try again.');
    }
    var out = {};
    try { out = await res.json(); } catch (e) {}
    if (res.status === 401) localStorage.removeItem(KEY);
    if (!res.ok) {
      var err = new Error((out.error && out.error.message) || 'Something went wrong');
      err.status = res.status;
      throw err;
    }
    return out;
  }

  /* ---------- sign in ---------- */
  function signIn(message) {
    clearInterval(timer);
    data = null;
    document.body.className = 'signin-page';
    app.innerHTML =
      '<main class="signin"><div class="signin-card">' +
        '<h1>Host dashboard</h1>' +
        '<p class="signin-sub">Sign in to see your live sessions and what they earned.</p>' +
        '<form id="f" novalidate>' +
          '<div class="field-block"><label for="u">Username</label>' +
            '<div class="field"><input id="u" autocomplete="username" autocapitalize="none" autofocus></div></div>' +
          '<div class="field-block"><label for="p">Password</label>' +
            '<div class="field"><input id="p" type="password" autocomplete="current-password"></div></div>' +
          '<div class="field-error signin-error" id="e"' + (message ? '' : ' hidden') + '>' + esc(message || '') + '</div>' +
          '<button class="btn btn-primary signin-go" type="submit" id="go">Sign in</button>' +
        '</form>' +
      '</div></main>';

    document.getElementById('f').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var u = document.getElementById('u').value.trim();
      var p = document.getElementById('p').value;
      var e = document.getElementById('e');
      var go = document.getElementById('go');
      e.hidden = true;
      if (!u || !p) { e.textContent = 'Enter your username and password'; e.hidden = false; return; }
      go.disabled = true; go.textContent = 'Checking';
      try {
        var out = await call('/host/login', { method: 'POST', body: { username: u, password: p } });
        localStorage.setItem(KEY, out.token);
        load();
      } catch (err) {
        go.disabled = false; go.textContent = 'Sign in';
        e.textContent = err.message; e.hidden = false;
        document.getElementById('p').value = '';
      }
    });
  }

  /* ---------- shell ---------- */
  var VIEWS = [
    { id: 'overview', label: 'Overview', icon: 'dash' },
    { id: 'live', label: 'Live now', icon: 'live' },
    { id: 'sessions', label: 'Sessions', icon: 'logs' },
    { id: 'earnings', label: 'Earnings', icon: 'chart' },
    { id: 'help', label: 'How it works', icon: 'help', section: 'Help' }
  ];
  function current() {
    var v = (location.hash || '').replace('#', '');
    return VIEWS.some(function (x) { return x.id === v; }) ? v : 'overview';
  }
  function liveSession() {
    return data && data.sessions.filter(function (s) { return s.status === 'live'; })[0];
  }

  function shell() {
    var view = current();
    var live = liveSession();
    var info = VIEWS.filter(function (v) { return v.id === view; })[0];
    document.body.className = '';
    app.innerHTML =
      '<div class="shell">' +
        '<aside class="rail" id="rail">' +
          '<div class="rail-brand"><b>Host</b><span>Studio</span></div>' +
          '<nav class="rail-nav">' +
            '<div class="rail-sect">Dashboard</div>' +
            VIEWS.map(function (v) {
              var extra = v.id === 'live' && live ? '<span class="tag">Live</span>' : '';
              return (v.section ? '<div class="rail-sect">' + v.section + '</div>' : '') +
                '<a href="#' + v.id + '" class="' + (v.id === view ? 'on' : '') + '">' +
                icon(v.icon) + v.label + extra + '</a>';
            }).join('') +
          '</nav>' +
          '<div class="rail-foot">' +
            '<div class="rail-me"><i>' + esc(initials(data.host.name)) + '</i>' +
              '<span><b>' + esc(data.host.name) + '</b><span>@' + esc(data.host.username) + '</span></span></div>' +
            '<button class="rail-out" id="out">' + icon('out') + 'Sign out</button>' +
          '</div>' +
        '</aside>' +
        '<div class="main">' +
          '<header class="topbar">' +
            '<button class="iconbtn rail-toggle" id="railToggle" aria-label="Menu">' + icon('menu', 19) + '</button>' +
            '<h1>' + info.label + '</h1>' +
            '<span class="spacer"></span>' +
            '<span class="sub" id="stamp">Updated ' + time(new Date().toISOString()) + '</span>' +
            '<button class="iconbtn" id="refresh" aria-label="Refresh">' + icon('refresh', 17) + '</button>' +
          '</header>' +
          '<div class="page" id="page">' + VIEW_RENDER[view]() + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="scrim" id="scrim"></div>';

    document.getElementById('out').addEventListener('click', function () {
      localStorage.removeItem(KEY); location.hash = ''; signIn();
    });
    document.getElementById('refresh').addEventListener('click', function () { load(true); });
    document.getElementById('railToggle').addEventListener('click', function () {
      document.getElementById('rail').classList.add('on');
      document.getElementById('scrim').classList.add('on');
    });
    document.getElementById('scrim').addEventListener('click', closeRail);
    var tabs = document.getElementById('rangeTabs');
    if (tabs) tabs.addEventListener('click', function (e) {
      var b = e.target.closest('[data-range]');
      if (b) { range = b.getAttribute('data-range'); shell(); }
    });

    clearInterval(timer);
    if (live) timer = setInterval(function () { load(true); }, 30000);
  }
  function closeRail() {
    var r = document.getElementById('rail'), s = document.getElementById('scrim');
    if (r) r.classList.remove('on');
    if (s) s.classList.remove('on');
  }

  /* ---------- views ---------- */
  function sessionRows(list) {
    return list.map(function (s) {
      return '<tr>' +
        '<td><div class="cell-main">' + esc(s.channel) +
          (s.status === 'live' ? ' <span class="pill bad">live</span>' : '') + '</div>' +
          '<div class="cell-sub">' + day(s.startedAt) + ' · ' + time(s.startedAt) +
          (s.domain ? ' · ' + esc(s.domain) : '') + '</div></td>' +
        '<td class="num right">' + ranFor(s.startedAt, s.endedAt) + '</td>' +
        '<td class="num right">' + count(s.signups) + '</td>' +
        '<td class="num right">' + money(s.depositsMinor) + '</td>' +
        '<td class="num right">' + count(s.trades) + '</td>' +
        '<td class="num right ' + tone(s.earningsMinor) + '">' + money(s.earningsMinor) + '</td>' +
      '</tr>';
    }).join('');
  }
  function sessionTable(list) {
    return '<div class="table-wrap"><table><thead><tr>' +
      '<th>Session</th><th class="right">Ran for</th><th class="right">New accounts</th>' +
      '<th class="right">Deposits</th><th class="right">Trades</th><th class="right">Earned</th>' +
      '</tr></thead><tbody>' + sessionRows(list) + '</tbody></table></div>';
  }
  function monthStart() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1).getTime(); }

  var VIEW_RENDER = {
    overview: function () {
      var all = data.sessions;
      var month = all.filter(function (s) { return Date.parse(s.startedAt) >= monthStart(); });
      var live = liveSession();
      var earned = sum(all, 'earningsMinor');

      var recent = all.slice(0, 10).reverse();
      var peak = Math.max(1, Math.max.apply(null, recent.map(function (s) { return Math.abs(s.earningsMinor); })));
      var chart = recent.length
        ? '<div class="hd-bars">' + recent.map(function (s) {
            return '<div class="col" title="' + esc(day(s.startedAt)) + ' — ' + money(s.earningsMinor) + '">' +
              '<div class="b ' + (s.earningsMinor < 0 ? 'neg' : '') + '" style="height:' +
                Math.round(Math.abs(s.earningsMinor) / peak * 100) + '%"></div>' +
              '<div class="x">' + new Date(s.startedAt).getDate() + '/' + (new Date(s.startedAt).getMonth() + 1) + '</div>' +
            '</div>';
          }).join('') + '</div>'
        : empty('No sessions yet', 'Your sessions show here once you have gone live.');

      var last = all[0];
      var lastCard = last
        ? '<div class="hd-last">' +
            '<div class="kv"><span>Channel</span><b>' + esc(last.channel) + '</b></div>' +
            '<div class="kv"><span>Date</span><b>' + day(last.startedAt) + '</b></div>' +
            '<div class="kv"><span>Ran for</span><b>' + ranFor(last.startedAt, last.endedAt) + '</b></div>' +
            '<div class="kv"><span>New accounts</span><b>' + count(last.signups) + '</b></div>' +
            '<div class="kv"><span>Deposits</span><b>' + money(last.depositsMinor) + '</b></div>' +
            '<div class="kv"><span>Earned</span><b class="' + tone(last.earningsMinor) + '">' + money(last.earningsMinor) + '</b></div>' +
          '</div>'
        : empty('Nothing yet', 'Your latest session will show here.');

      return (live
          ? '<a href="#live" class="card live-card" style="display:flex;align-items:center;gap:12px;padding:14px 18px">' +
              '<span class="live-dot"></span><b>You are live on ' + esc(live.channel) + '</b>' +
              '<span class="muted">' + ranFor(live.startedAt) + ' · ' + money(live.earningsMinor) + ' so far</span>' +
              '<span class="spacer" style="flex:1"></span><span class="muted">Open ›</span></a>'
          : '') +
        '<div class="kpis">' +
          kpi('Total earned', money(earned), count(all.length) + ' sessions', tone(earned)) +
          kpi('This month', money(sum(month, 'earningsMinor')), count(month.length) + ' sessions') +
          kpi('Deposits', money(sum(all, 'depositsMinor')), count(sum(all, 'depositCount')) + ' deposits') +
          kpi('New accounts', count(sum(all, 'signups')), 'from your sessions') +
        '</div>' +
        '<div class="hd-grid">' +
          card('Earned per session', chart + '<div class="legend" style="margin-top:12px"><span><i class="a"></i>Last ' +
            recent.length + ' sessions</span></div>') +
          card('Latest session', lastCard) +
        '</div>';
    },

    live: function () {
      var s = liveSession();
      if (!s) return card('', empty('You are not live right now',
        'When a session is started for you, its figures appear here and update every 30 seconds.'), '', true);
      return '<section class="card live-card">' +
          '<div class="card-head"><span class="live-dot"></span>' +
            '<h2>' + esc(s.channel) + (s.domain ? ' · ' + esc(s.domain) : '') + '</h2><span class="spacer"></span>' +
            '<span class="muted" style="font-size:12px">Started ' + time(s.startedAt) + ' · running <b>' + ranFor(s.startedAt) + '</b></span></div>' +
          '<div class="kpis" style="border:none">' +
            kpi('Earned so far', money(s.earningsMinor), 'this session', tone(s.earningsMinor)) +
            kpi('Deposits', money(s.depositsMinor), count(s.depositCount) + ' deposits') +
            kpi('New accounts', count(s.signups), 'since you went live') +
            kpi('Trades', count(s.trades), money(s.stakeVolumeMinor) + ' staked') +
          '</div>' +
        '</section>' +
        (s.note ? card('Session note', '<div class="hd-help">' + esc(s.note) + '</div>') : '') +
        '<div class="foot-note">Updates every 30 seconds while you are live.</div>';
    },

    sessions: function () {
      var list = range === 'month'
        ? data.sessions.filter(function (s) { return Date.parse(s.startedAt) >= monthStart(); })
        : data.sessions;
      var tabs = '<div class="hd-tabs" id="rangeTabs">' +
        [['all', 'All time'], ['month', 'This month']].map(function (r) {
          return '<button class="btn btn-sm ' + (range === r[0] ? 'btn-primary' : 'btn-ghost') +
            '" data-range="' + r[0] + '">' + r[1] + '</button>';
        }).join('') + '</div>';
      return '<div class="kpis">' +
          kpi('Sessions', count(list.length), range === 'month' ? 'this month' : 'all time') +
          kpi('Earned', money(sum(list, 'earningsMinor')), 'across these sessions', tone(sum(list, 'earningsMinor'))) +
          kpi('Deposits', money(sum(list, 'depositsMinor')), count(sum(list, 'depositCount')) + ' deposits') +
          kpi('New accounts', count(sum(list, 'signups')), count(sum(list, 'trades')) + ' trades') +
        '</div>' +
        card(count(list.length) + ' sessions', list.length ? sessionTable(list)
          : empty('No sessions here', 'Nothing in this period.'), tabs, true);
    },

    earnings: function () {
      var months = {};
      data.sessions.forEach(function (s) {
        var d = new Date(s.startedAt);
        var k = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
        var m = months[k] || (months[k] = { key: k, label: d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }),
          sessions: 0, earned: 0, deposits: 0, signups: 0 });
        m.sessions += 1; m.earned += s.earningsMinor; m.deposits += s.depositsMinor; m.signups += s.signups;
      });
      var rows = Object.keys(months).sort().reverse().map(function (k) { return months[k]; });
      var best = rows.reduce(function (a, m) { return !a || m.earned > a.earned ? m : a; }, null);
      var total = sum(data.sessions, 'earningsMinor');
      var avg = data.sessions.length ? Math.round(total / data.sessions.length) : 0;
      return '<div class="kpis">' +
          kpi('Total earned', money(total), 'all time', tone(total)) +
          kpi('Average per session', money(avg), count(data.sessions.length) + ' sessions') +
          kpi('Best month', best ? money(best.earned) : '—', best ? best.label : 'no sessions yet') +
          kpi('Months active', count(rows.length), 'with at least one session') +
        '</div>' +
        card('By month', rows.length
          ? '<div class="table-wrap"><table><thead><tr><th>Month</th><th class="right">Sessions</th>' +
              '<th class="right">New accounts</th><th class="right">Deposits</th><th class="right">Earned</th></tr></thead><tbody>' +
              rows.map(function (m) {
                return '<tr><td class="cell-main">' + esc(m.label) + '</td>' +
                  '<td class="num right">' + count(m.sessions) + '</td>' +
                  '<td class="num right">' + count(m.signups) + '</td>' +
                  '<td class="num right">' + money(m.deposits) + '</td>' +
                  '<td class="num right ' + tone(m.earned) + '">' + money(m.earned) + '</td></tr>';
              }).join('') + '</tbody></table></div>'
          : empty('No earnings yet', 'Earnings are grouped by month once you have run a session.'), '', true);
    },

    help: function () {
      return card('How your figures are counted',
        '<div class="hd-help">' +
          '<h3>Earned</h3>What the platform made from trading while your session ran: stakes lost by customers ' +
            'less winnings paid out. It can be negative when customers win more than they lose.' +
          '<h3>Deposits</h3>Money customers deposited while your session was live. It is shown so you can see ' +
            'activity, but it is customer money, not earnings.' +
          '<h3>New accounts</h3>Accounts opened while your session was live.' +
          '<h3>What is left out</h3>Only real money counts. Demo accounts and test wallets are not included.' +
          '<h3>Questions</h3>If a figure looks wrong, contact the team that set up your login.' +
        '</div>');
    }
  };

  /* ---------- load ---------- */
  async function load(quiet) {
    if (!localStorage.getItem(KEY)) return signIn();
    if (!quiet || !data) {
      document.body.className = '';
      app.innerHTML = '<div class="page"><div class="hd-empty">Loading your dashboard</div></div>';
    }
    try {
      var out = await call('/host/me');
      data = { host: out.host, sessions: out.sessions || [] };
    } catch (err) {
      if (err.status === 401 || err.status === 403) return signIn(err.message);
      if (data) return;   /* keep showing the last figures on a failed refresh */
      app.innerHTML = '<div class="page"><div class="hd-empty"><b>Could not load your dashboard</b>' + esc(err.message) +
        '<div style="margin-top:12px"><button class="btn btn-ghost btn-sm" id="retry">Try again</button></div></div></div>';
      document.getElementById('retry').addEventListener('click', function () { load(); });
      return;
    }
    shell();
  }

  window.addEventListener('hashchange', function () { if (data) { closeRail(); shell(); } });
  load();
})();
</script>
</body>
</html>
