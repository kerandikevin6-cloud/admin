<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novi Admin, Users</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="users" data-title="Users">
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/admin.js"></script>
<script>
(function () {
  var A = window.Admin;
  if (!A.mountChrome()) return;   /* not signed in */

  var page = document.getElementById('page');
  var state = { q: '', kyc: 'all', status: 'all' };
  var rows = [];
  var total = 0;
  var loading = false;
  var failure = null;
  var timer = null;

  /* Typing must not fire a request per keystroke once this is talking to
     a server; 300ms is long enough to batch and short enough to feel
     immediate. */
  function search(value) {
    state.q = value;
    clearTimeout(timer);
    timer = setTimeout(load, A.data.live ? 300 : 0);
  }

  async function load() {
    loading = true; failure = null; paint();
    try {
      var out = await A.data.users({ q: state.q, kyc: state.kyc, status: state.status });
      rows = out.users; total = out.total;
    } catch (err) {
      failure = err.message;
    }
    loading = false;
    paint();
  }

  function paint() {
    var filters = '<div class="filters">' +
      '<label class="field search-field">' + A.icon('search', 15) +
        '<input id="q" type="search" placeholder="Name, email or phone" value="' +
        A.esc(state.q) + '" aria-label="Search users"></label>' +
      '<label class="field"><select id="kyc" aria-label="Identity status">' +
        ['all', 'verified', 'pending', 'unverified', 'rejected'].map(function (v) {
          return '<option value="' + v + '"' + (state.kyc === v ? ' selected' : '') + '>' +
            (v === 'all' ? 'All identity states' : v) + '</option>';
        }).join('') + '</select></label>' +
      '<div class="seg" id="statusSeg">' +
        ['all', 'active', 'suspended'].map(function (v) {
          return '<button data-status="' + v + '" class="' + (state.status === v ? 'on' : '') + '">' +
            (v === 'all' ? 'All' : v.charAt(0).toUpperCase() + v.slice(1)) + '</button>';
        }).join('') +
      '</div>' +
    '</div>';

    var body;
    if (loading) body = A.loadingBlock('Loading accounts');
    else if (failure) body = A.errorBlock(failure, 'retry');
    else if (!rows.length) body = A.emptyBlock('No accounts yet',
      state.q || state.kyc !== 'all' || state.status !== 'all'
        ? 'Nothing matches those filters.'
        : 'Customers appear here as soon as the first person signs up.');
    else body = A.table([
      { label: 'Customer' }, { label: 'Location' }, { label: 'Identity' },
      { label: 'Account' }, { label: 'Balance', right: true },
      { label: 'Trades', right: true }, { label: 'Joined', right: true }
    ], rows.map(function (u) {
      return '<tr class="row-click" data-user="' + A.esc(u.id) + '">' +
        /* The badge sits on the name line rather than in a column of
           its own: a tier column would be blank ninety times out of a
           hundred, and a column that is mostly empty reads as missing
           data rather than as "no". Built here instead of through
           A.who(), which escapes its arguments and would print the
           markup rather than render it. */
        '<td><div class="cell-main">' + A.esc(u.name) +
            (u.tier === 'vip' ? '<span class="tier-badge">VIP</span>' : '') + '</div>' +
          '<div class="cell-sub">' + A.esc(u.email) + '</div></td>' +
        '<td>' + A.esc(u.countryName || u.country || '') +
          '<div class="cell-sub">' + (u.phone ? '+' + A.esc(u.phone) : '') + '</div></td>' +
        '<td>' + A.pill(u.kyc) + '</td>' +
        '<td>' + A.pill(u.status) + '</td>' +
        '<td class="num right">' + A.usd(u.balanceMinor) + '</td>' +
        '<td class="num right">' + A.count(u.trades) + '</td>' +
        '<td class="right muted">' + (u.joined ? A.date(u.joined) : '') + '</td>' +
      '</tr>';
    }));

    page.innerHTML = filters +
      A.card(loading ? 'Accounts' : rows.length + ' of ' + total + ' accounts', body, '', true);
    wire();
  }

  function wire() {
    var q = document.getElementById('q');
    if (q) {
      q.addEventListener('input', function () {
        var at = this.selectionStart;
        search(this.value);
        var box = document.getElementById('q');
        if (box) { box.focus(); try { box.setSelectionRange(at, at); } catch (e) {} }
      });
    }
    var kyc = document.getElementById('kyc');
    if (kyc) kyc.addEventListener('change', function () { state.kyc = this.value; load(); });

    var seg = document.getElementById('statusSeg');
    if (seg) seg.addEventListener('click', function (e) {
      var b = e.target.closest('[data-status]');
      if (b) { state.status = b.getAttribute('data-status'); load(); }
    });

    var retry = document.getElementById('retry');
    if (retry) retry.addEventListener('click', load);

    page.addEventListener('click', function (e) {
      var row = e.target.closest('[data-user]');
      if (row) showUser(row.getAttribute('data-user'));
    });
  }

  /* ---------------- the VIP handset ----------------
     A VIP deposits from the companion M-Pesa app instead of from a real
     provider, and this is where that handset is set up: the PIN the
     customer types once, the balance they will see, and the Fuliza limit
     they can overdraw into.

     Tier and wallet are deliberately separate. Promoting somebody is one
     decision and provisioning their phone is another, they fail
     separately, and "VIP with no wallet" is a state an operator has to
     be able to see rather than infer from a deposit that will not work. */
  function field(id, label, value, hint, attrs) {
    return '<div class="field-block"><label for="' + id + '">' + label + '</label>' +
      '<div class="field"><input id="' + id + '" value="' + A.esc(value == null ? '' : value) +
        '" ' + (attrs || '') + '></div>' +
      (hint ? '<span class="hint">' + hint + '</span>' : '') +
      '<div class="field-error" id="' + id + 'Error" hidden></div></div>';
  }

  function walletSection(u, rail) {
    if ((u.tier || 'standard') !== 'vip') {
      return '<div><div class="sect-label">M-Pesa handset</div>' +
        '<div class="muted" style="font-size:12.5px;line-height:1.6">' +
          'Standard accounts deposit real money through M-Pesa and card. ' +
          'Make this account VIP to set up a demo handset for it.</div></div>';
    }

    if (rail.error) {
      return '<div><div class="sect-label">M-Pesa handset</div>' +
        '<div class="muted" style="font-size:12.5px">Could not load the handset: ' +
        A.esc(rail.error) + '</div></div>';
    }

    var w = rail.wallet;
    var linked = w
      ? '<div class="kv"><span>Shows as</span><b class="num">' +
          A.esc(w.holderName || u.name) +
          (w.phone ? ' &middot; +' + A.esc(w.phone) : '') + '</b></div>' +
        '<div class="kv"><span>Balance on the phone</span><b class="num">' +
          A.money(w.balanceMinor) + '</b></div>' +
        '<div class="kv"><span>Fuliza used</span><b class="num">' +
          A.money(w.fulizaUsedMinor) + ' of ' + A.money(w.fulizaLimitMinor) + '</b></div>' +
        '<div class="kv"><span>PIN</span><b class="num">' + A.esc(w.pin) + '</b></div>'
      : '<div class="muted" style="font-size:12.5px;line-height:1.6">' +
        'No handset yet. Set a PIN and an opening balance, then have them ' +
        'type that PIN into the M-Pesa app once.</div>';

    var recent = (rail.statement || []).slice(0, 5).map(function (t) {
      return '<div class="kv"><span>' + A.esc(t.title) + '<br>' +
        '<span class="muted" style="font-size:11px">' + A.dateTime(t.at) + '</span></span>' +
        '<b class="num ' + (t.amountMinor >= 0 ? 'pos' : 'neg') + '">' +
        A.money(t.amountMinor) + '</b></div>';
    }).join('');

    return '<div><div class="sect-label">M-Pesa handset</div>' + linked +
      '<div style="margin-top:14px">' +
        field('wPin', 'PIN', w ? w.pin : '', 'Four digits. The customer types this into the phone once.',
              'inputmode="numeric" maxlength="4" placeholder="0000"') +
        field('wBal', 'Balance on the phone (KSh)', w ? Math.round(w.balanceMinor / 100) : '',
              'What the handset shows.', 'inputmode="numeric" placeholder="50000"') +
        field('wFul', 'Fuliza limit (KSh)', w ? Math.round(w.fulizaLimitMinor / 100) : '',
              'How far past zero they can spend. Repaid from the next money in.',
              'inputmode="numeric" placeholder="5000"') +
        /* What the handset puts on its own lock screen, masked — and,
           since the rail started texting its confirmations, the number
           those messages go to. It is set here rather than taken from
           whatever the customer types into the deposit form, because the
           phone shows it before any deposit exists. Left blank it follows
           the account's own details; wrong, and the confirmations go to a
           stranger, so it is worth the Test SMS button below. */
        field('wName', 'Name on the phone', w ? (w.holderName || '') : u.name,
              'Shown at the top of the app. Defaults to the account name.',
              'placeholder="' + A.esc(u.name) + '"') +
        field('wPhone', 'Number on the phone', w ? (w.phone || '') : (u.phone || ''),
              'Shown on the PIN screen, and where M-PESA confirmation messages are sent.',
              'inputmode="numeric" placeholder="254712345678"') +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">' +
          '<button class="btn btn-primary btn-sm" id="wSave">' +
            (w ? 'Save handset' : 'Create handset') + '</button>' +
          (w ? '<button class="btn btn-ghost btn-sm" id="wReset">Reset</button>' +
               '<button class="btn btn-ghost btn-sm" id="wTestSms">Test SMS</button>' +
               '<button class="btn btn-danger btn-sm" id="wClear">Remove</button>' : '') +
        '</div>' +
      '</div>' +
      (recent ? '<div style="margin-top:16px"><div class="sect-label">On the phone</div>' +
                recent + '</div>' : '') +
    '</div>';
  }

  function wireWallet(u, rail) {
    var save = document.getElementById('wSave');
    if (!save) return;

    function err(id, msg) {
      var box = document.getElementById(id + 'Error');
      if (!box) return;
      box.textContent = msg || '';
      box.hidden = !msg;
    }
    var shillings = function (id) {
      var raw = (document.getElementById(id) || {}).value;
      if (raw == null || String(raw).trim() === '') return null;
      var n = Number(String(raw).replace(/[^0-9]/g, ''));
      return isNaN(n) ? null : n * 100;
    };

    save.addEventListener('click', async function () {
      err('wPin', ''); err('wBal', ''); err('wFul', '');

      var pin = ((document.getElementById('wPin') || {}).value || '').trim();
      if (!/^\d{4}$/.test(pin)) {
        err('wPin', 'Four digits');
        return;
      }

      save.disabled = true;
      save.innerHTML = A.loader('sm') + 'Saving';
      try {
        var text = function (id) {
          var v = ((document.getElementById(id) || {}).value || '').trim();
          return v === '' ? undefined : v;
        };

        await A.data.saveWallet(u.id, {
          pin: pin,
          balanceMinor: shillings('wBal'),
          fulizaLimitMinor: shillings('wFul'),
          name: text('wName'),
          /* Digits only: somebody will type +254 712 345 678, and the
             handset renders whatever it is given. */
          phone: (text('wPhone') || '').replace(/[^0-9]/g, '') || undefined
        });
      } catch (e) {
        save.disabled = false;
        save.textContent = rail.wallet ? 'Save handset' : 'Create handset';
        err('wPin', e.message);
        return;
      }
      A.closeAll();
      await load();
      A.toast('Handset ready. PIN ' + pin);
    });

    var reset = document.getElementById('wReset');
    if (reset) reset.addEventListener('click', async function () {
      reset.disabled = true;
      reset.innerHTML = A.loader('sm') + 'Resetting';
      try {
        await A.data.resetWallet(u.id, shillings('wBal'));
      } catch (e) {
        reset.disabled = false; reset.textContent = 'Reset';
        A.toast(e.message); return;
      }
      A.closeAll();
      await load();
      A.toast('Handset reset. The phone stays linked.');
    });

    /* The number saved on the wallet, not the one in the box above: the
       point is to prove what a real confirmation will do, and a real
       confirmation reads the wallet. Save first, then test. */
    var test = document.getElementById('wTestSms');
    if (test) test.addEventListener('click', async function () {
      test.disabled = true;
      test.innerHTML = A.loader('sm') + 'Sending';
      try {
        var out = await A.data.testWalletSms(u.id);
        A.toast(out.ok
          ? 'Sent to +' + out.to + ' as ' + (out.sender || 'the gateway') +
            (out.provider ? ' via ' + out.provider : '')
          : 'Not sent: ' + (out.detail || 'the gateway refused it'));
      } catch (e) {
        A.toast(e.message);
      }
      test.disabled = false;
      test.textContent = 'Test SMS';
    });

    var clear = document.getElementById('wClear');
    if (clear) clear.addEventListener('click', async function () {
      if (!window.confirm('Remove this handset? The phone will be unlinked and ' +
          'the statement deleted.')) return;
      clear.disabled = true;
      try {
        await A.data.clearWallet(u.id);
      } catch (e) {
        clear.disabled = false; A.toast(e.message); return;
      }
      A.closeAll();
      await load();
      A.toast('Handset removed');
    });
  }

  async function showUser(id) {
    A.openDrawer('<div class="drawer-body">' + A.loadingBlock('Loading account') + '</div>');

    var detail;
    try {
      detail = await A.data.user(id);
    } catch (err) {
      A.openDrawer('<div class="drawer-body">' + A.errorBlock(err.message) + '</div>');
      return;
    }

    /* The handset is a separate read, and a failure to fetch it must not
       stop an operator seeing the account. A missing wallet and an
       unreachable one are different states and the panel says which. */
    var rail = { wallet: null, statement: [], error: null };
    try {
      rail = Object.assign(rail, await A.data.wallet(id));
    } catch (err) {
      rail.error = err.message;
    }

    var u = detail.user;
    var deposits = detail.payments.length
      ? detail.payments.map(function (p) {
          return '<div class="kv"><span>' + A.dateTime(p.created) +
            '<br><span class="muted" style="font-size:11px">' + A.esc(p.reference) + '</span></span>' +
            '<b>' + A.money(p.amountMinor, p.currency) + ' ' + A.pill(p.status) + '</b></div>';
        }).join('')
      : '<div class="muted" style="font-size:12.5px">No deposits yet</div>';

    var outs = detail.withdrawals.length
      ? detail.withdrawals.map(function (w) {
          return '<div class="kv"><span>' + A.dateTime(w.created) + '</span>' +
            '<b>' + A.usd(w.amountMinor) + ' ' + A.pill(w.status) + '</b></div>';
        }).join('')
      : '<div class="muted" style="font-size:12.5px">No withdrawals yet</div>';

    A.openDrawer(
      '<div class="drawer-head">' +
        '<div style="flex:1"><h2>' + A.esc(u.name) + '</h2>' +
        '<p>' + A.esc(u.email) + '</p></div>' +
        '<button class="iconbtn" data-close aria-label="Close">' + A.icon('close', 18) + '</button>' +
      '</div>' +
      '<div class="drawer-body">' +
        '<div><div class="sect-label">Account</div>' +
          '<div class="kv"><span>Real balance</span><b class="num">' + A.usd(u.balanceMinor) + '</b></div>' +
          '<div class="kv"><span>Demo balance</span><b class="num">' + A.usd(u.demoMinor) + '</b></div>' +
          '<div class="kv"><span>Identity</span><b>' + A.pill(u.kyc) + '</b></div>' +
          '<div class="kv"><span>Status</span><b>' + A.pill(u.status) + '</b></div>' +
          '<div class="kv"><span>Tier</span><b>' + A.pill(u.tier || 'standard') + '</b></div>' +
          (u.demoMode
            ? '<div class="kv"><span>VIP demo</span><b class="demo-on">ON, wins are staged</b></div>'
            : '') +
        '</div>' +
        '<div><div class="sect-label">Profile</div>' +
          '<div class="kv"><span>Phone</span><b class="num">' +
            (u.phone ? '+' + A.esc(u.phone) : '') + '</b></div>' +
          '<div class="kv"><span>Country</span><b>' + A.esc(u.country || '') + '</b></div>' +
          '<div class="kv"><span>Joined</span><b>' + (u.joined ? A.date(u.joined) : '') + '</b></div>' +
          '<div class="kv"><span>Last seen</span><b>' +
            (u.lastSeen ? A.ago(u.lastSeen) : '') + '</b></div>' +
          '<div class="kv"><span>Contracts placed</span><b class="num">' +
            A.count(u.trades) + '</b></div>' +
        '</div>' +
        walletSection(u, rail) +
        '<div><div class="sect-label">Recent deposits</div>' + deposits + '</div>' +
        '<div><div class="sect-label">Recent withdrawals</div>' + outs + '</div>' +
      '</div>' +
      '<div class="drawer-foot">' +
        (u.kyc === 'pending'
          ? '<button class="btn btn-primary btn-sm" data-act="verify">' +
              A.icon('check', 15) + 'Approve identity</button>' +
            '<button class="btn btn-danger btn-sm" data-act="reject">Reject identity</button>'
          : '') +
        (u.tier === 'vip'
          ? '<button class="btn btn-ghost btn-sm" data-act="standard">Move to Standard</button>' +
            (u.demoMode
              ? '<button class="btn btn-danger btn-sm" data-act="demoOff">Turn off VIP demo</button>'
              : '<button class="btn btn-ghost btn-sm" data-act="demoOn">Turn on VIP demo</button>')
          : '<button class="btn btn-ghost btn-sm" data-act="vip">Make VIP</button>') +
        (u.status === 'active'
          ? '<button class="btn btn-danger btn-sm" data-act="suspend">' +
              A.icon('ban', 15) + 'Suspend account</button>'
          : '<button class="btn btn-primary btn-sm" data-act="restore">Restore account</button>') +
      '</div>');

    wireWallet(u, rail);

    var foot = document.querySelector('.drawer-foot');
    if (foot) foot.addEventListener('click', async function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var act = b.getAttribute('data-act');

      var patch =
        act === 'verify' ? { kycStatus: 'verified' } :
        act === 'reject' ? { kycStatus: 'rejected' } :
        act === 'suspend' ? { status: 'suspended' } :
        act === 'vip' ? { tier: 'vip' } :
        act === 'standard' ? { tier: 'standard' } :
        act === 'demoOn' ? { demoMode: true } :
        act === 'demoOff' ? { demoMode: false } : { status: 'active' };

      /* Disable the whole row of actions, not just the one pressed: two
         conflicting decisions sent in a row is worse than a slow one. */
      [].forEach.call(foot.querySelectorAll('button'), function (x) { x.disabled = true; });
      b.innerHTML = A.loader('sm') + 'Saving';

      try {
        await A.data.updateUser(u.id, patch);
      } catch (err) {
        [].forEach.call(foot.querySelectorAll('button'), function (x) { x.disabled = false; });
        A.toast(err.message);
        return;
      }

      A.closeAll();
      await load();
      A.toast(u.name + ' \u2014 ' + (
        act === 'verify' ? 'identity approved' :
        act === 'reject' ? 'identity rejected' :
        act === 'suspend' ? 'account suspended' :
        act === 'vip' ? 'is VIP now. Set up the handset below.' :
        act === 'standard' ? 'is back on Standard, real money' :
        act === 'demoOn' ? 'is on VIP demo. The terminal shows a marker while it is on.' :
        act === 'demoOff' ? 'is back on the published odds' : 'account restored'));
    });
  }

  load();
})();
</script>
</body>
</html>
