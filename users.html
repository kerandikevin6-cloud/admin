<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexas Admin — Users</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="users" data-title="Users">
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/admin.js"></script>
<script>
(function () {
  var A = window.Admin;
  if (!A.mountChrome()) return;   /* not signed in */

  var page = document.getElementById('page');
  var state = { q: '', kyc: 'all', status: 'all' };
  var rows = [];
  var total = 0;
  var loading = false;
  var failure = null;
  var timer = null;

  /* Typing must not fire a request per keystroke once this is talking to
     a server; 300ms is long enough to batch and short enough to feel
     immediate. */
  function search(value) {
    state.q = value;
    clearTimeout(timer);
    timer = setTimeout(load, A.data.live ? 300 : 0);
  }

  async function load() {
    loading = true; failure = null; paint();
    try {
      var out = await A.data.users({ q: state.q, kyc: state.kyc, status: state.status });
      rows = out.users; total = out.total;
    } catch (err) {
      failure = err.message;
    }
    loading = false;
    paint();
  }

  function paint() {
    var filters = '<div class="filters">' +
      '<label class="field search-field">' + A.icon('search', 15) +
        '<input id="q" type="search" placeholder="Name, email or phone" value="' +
        A.esc(state.q) + '" aria-label="Search users"></label>' +
      '<label class="field"><select id="kyc" aria-label="Identity status">' +
        ['all', 'verified', 'pending', 'unverified', 'rejected'].map(function (v) {
          return '<option value="' + v + '"' + (state.kyc === v ? ' selected' : '') + '>' +
            (v === 'all' ? 'All identity states' : v) + '</option>';
        }).join('') + '</select></label>' +
      '<div class="seg" id="statusSeg">' +
        ['all', 'active', 'suspended'].map(function (v) {
          return '<button data-status="' + v + '" class="' + (state.status === v ? 'on' : '') + '">' +
            (v === 'all' ? 'All' : v.charAt(0).toUpperCase() + v.slice(1)) + '</button>';
        }).join('') +
      '</div>' +
    '</div>';

    var body;
    if (loading) body = A.loadingBlock('Loading accounts');
    else if (failure) body = A.errorBlock(failure, 'retry');
    else if (!rows.length) body = A.emptyBlock('No accounts yet',
      state.q || state.kyc !== 'all' || state.status !== 'all'
        ? 'Nothing matches those filters.'
        : 'Customers appear here as soon as the first person signs up.');
    else body = A.table([
      { label: 'Customer' }, { label: 'Location' }, { label: 'Identity' },
      { label: 'Account' }, { label: 'Balance', right: true },
      { label: 'Trades', right: true }, { label: 'Joined', right: true }
    ], rows.map(function (u) {
      return '<tr class="row-click" data-user="' + A.esc(u.id) + '">' +
        '<td>' + A.who(u.name, u.email) + '</td>' +
        '<td>' + A.esc(u.countryName || u.country || '—') +
          '<div class="cell-sub">' + (u.phone ? '+' + A.esc(u.phone) : '—') + '</div></td>' +
        '<td>' + A.pill(u.kyc) + '</td>' +
        '<td>' + A.pill(u.status) + '</td>' +
        '<td class="num right">' + A.usd(u.balanceMinor) + '</td>' +
        '<td class="num right">' + A.count(u.trades) + '</td>' +
        '<td class="right muted">' + (u.joined ? A.date(u.joined) : '—') + '</td>' +
      '</tr>';
    }));

    page.innerHTML = filters +
      A.card(loading ? 'Accounts' : rows.length + ' of ' + total + ' accounts', body, '', true);
    wire();
  }

  function wire() {
    var q = document.getElementById('q');
    if (q) {
      q.addEventListener('input', function () {
        var at = this.selectionStart;
        search(this.value);
        var box = document.getElementById('q');
        if (box) { box.focus(); try { box.setSelectionRange(at, at); } catch (e) {} }
      });
    }
    var kyc = document.getElementById('kyc');
    if (kyc) kyc.addEventListener('change', function () { state.kyc = this.value; load(); });

    var seg = document.getElementById('statusSeg');
    if (seg) seg.addEventListener('click', function (e) {
      var b = e.target.closest('[data-status]');
      if (b) { state.status = b.getAttribute('data-status'); load(); }
    });

    var retry = document.getElementById('retry');
    if (retry) retry.addEventListener('click', load);

    page.addEventListener('click', function (e) {
      var row = e.target.closest('[data-user]');
      if (row) showUser(row.getAttribute('data-user'));
    });
  }

  async function showUser(id) {
    A.openDrawer('<div class="drawer-body">' + A.loadingBlock('Loading account') + '</div>');

    var detail;
    try {
      detail = await A.data.user(id);
    } catch (err) {
      A.openDrawer('<div class="drawer-body">' + A.errorBlock(err.message) + '</div>');
      return;
    }

    var u = detail.user;
    var deposits = detail.payments.length
      ? detail.payments.map(function (p) {
          return '<div class="kv"><span>' + A.dateTime(p.created) +
            '<br><span class="muted" style="font-size:11px">' + A.esc(p.reference) + '</span></span>' +
            '<b>' + A.money(p.amountMinor, p.currency) + ' ' + A.pill(p.status) + '</b></div>';
        }).join('')
      : '<div class="muted" style="font-size:12.5px">No deposits yet</div>';

    var outs = detail.withdrawals.length
      ? detail.withdrawals.map(function (w) {
          return '<div class="kv"><span>' + A.dateTime(w.created) + '</span>' +
            '<b>' + A.usd(w.amountMinor) + ' ' + A.pill(w.status) + '</b></div>';
        }).join('')
      : '<div class="muted" style="font-size:12.5px">No withdrawals yet</div>';

    A.openDrawer(
      '<div class="drawer-head">' +
        '<div style="flex:1"><h2>' + A.esc(u.name) + '</h2>' +
        '<p>' + A.esc(u.email) + '</p></div>' +
        '<button class="iconbtn" data-close aria-label="Close">' + A.icon('close', 18) + '</button>' +
      '</div>' +
      '<div class="drawer-body">' +
        '<div><div class="sect-label">Account</div>' +
          '<div class="kv"><span>Real balance</span><b class="num">' + A.usd(u.balanceMinor) + '</b></div>' +
          '<div class="kv"><span>Demo balance</span><b class="num">' + A.usd(u.demoMinor) + '</b></div>' +
          '<div class="kv"><span>Identity</span><b>' + A.pill(u.kyc) + '</b></div>' +
          '<div class="kv"><span>Status</span><b>' + A.pill(u.status) + '</b></div>' +
        '</div>' +
        '<div><div class="sect-label">Profile</div>' +
          '<div class="kv"><span>Phone</span><b class="num">' +
            (u.phone ? '+' + A.esc(u.phone) : '—') + '</b></div>' +
          '<div class="kv"><span>Country</span><b>' + A.esc(u.country || '—') + '</b></div>' +
          '<div class="kv"><span>Joined</span><b>' + (u.joined ? A.date(u.joined) : '—') + '</b></div>' +
          '<div class="kv"><span>Last seen</span><b>' +
            (u.lastSeen ? A.ago(u.lastSeen) : '—') + '</b></div>' +
          '<div class="kv"><span>Contracts placed</span><b class="num">' +
            A.count(u.trades) + '</b></div>' +
        '</div>' +
        '<div><div class="sect-label">Recent deposits</div>' + deposits + '</div>' +
        '<div><div class="sect-label">Recent withdrawals</div>' + outs + '</div>' +
      '</div>' +
      '<div class="drawer-foot">' +
        (u.kyc === 'pending'
          ? '<button class="btn btn-primary btn-sm" data-act="verify">' +
              A.icon('check', 15) + 'Approve identity</button>' +
            '<button class="btn btn-danger btn-sm" data-act="reject">Reject identity</button>'
          : '') +
        (u.status === 'active'
          ? '<button class="btn btn-danger btn-sm" data-act="suspend">' +
              A.icon('ban', 15) + 'Suspend account</button>'
          : '<button class="btn btn-primary btn-sm" data-act="restore">Restore account</button>') +
      '</div>');

    var foot = document.querySelector('.drawer-foot');
    if (foot) foot.addEventListener('click', async function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var act = b.getAttribute('data-act');

      var patch =
        act === 'verify' ? { kycStatus: 'verified' } :
        act === 'reject' ? { kycStatus: 'rejected' } :
        act === 'suspend' ? { status: 'suspended' } : { status: 'active' };

      /* Disable the whole row of actions, not just the one pressed: two
         conflicting decisions sent in a row is worse than a slow one. */
      [].forEach.call(foot.querySelectorAll('button'), function (x) { x.disabled = true; });
      b.innerHTML = A.loader('sm') + 'Saving';

      try {
        await A.data.updateUser(u.id, patch);
      } catch (err) {
        [].forEach.call(foot.querySelectorAll('button'), function (x) { x.disabled = false; });
        A.toast(err.message);
        return;
      }

      A.closeAll();
      await load();
      A.toast(u.name + ' \u2014 ' + (
        act === 'verify' ? 'identity approved' :
        act === 'reject' ? 'identity rejected' :
        act === 'suspend' ? 'account suspended' : 'account restored'));
    });
  }

  load();
})();
</script>
</body>
</html>
