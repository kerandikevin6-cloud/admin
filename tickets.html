<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novi Admin, Support</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="tickets" data-title="Support">
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/admin.js"></script>
<script>
(function () {
  var A = window.Admin;
  if (!A.mountChrome()) return;

  var page = document.getElementById('page');
  var rows = [];
  var view = 'open';

  var LABEL = {
    deposit: 'Deposit', withdrawal: 'Withdrawal', account: 'Account',
    trading: 'Trading', other: 'Something else'
  };

  async function load() {
    page.innerHTML = A.loadingBlock('Loading tickets');
    try {
      rows = await A.data.tickets(view);
    } catch (err) {
      page.innerHTML = A.errorBlock(err.message, 'retry');
      var r = document.getElementById('retry');
      if (r) r.addEventListener('click', load);
      return;
    }
    render();
  }

  function tabs() {
    return '<div class="filters"><div class="seg">' +
      ['open', 'answered', 'closed'].map(function (v) {
        return '<button data-view="' + v + '"' + (v === view ? ' class="on"' : '') + '>' +
          v.charAt(0).toUpperCase() + v.slice(1) + '</button>';
      }).join('') +
    '</div></div>';
  }

  /* The first line of the question in the row itself. A queue of names
     and timestamps makes every ticket look the same, and then they get
     worked in the order they appear rather than the order they matter. */
  function preview(body) {
    var one = (body || '').replace(/\s+/g, ' ').trim();
    return one.length > 90 ? one.slice(0, 90) + '…' : one;
  }

  function render() {
    if (!rows.length) {
      page.innerHTML = tabs() + A.card('Support',
        A.emptyBlock(view === 'open' ? 'Nothing waiting' : 'Nothing here',
          view === 'open'
            ? 'Questions customers send appear here, oldest first.'
            : 'Tickets you have answered show up under this tab.'));
      wire();
      return;
    }

    var list = rows.map(function (t) {
      return '<tr class="row-click" data-ticket="' + A.esc(t.id) + '">' +
        '<td><div class="cell-main">' + A.esc(t.userName || 'Unnamed') +
            (t.userTier === 'vip' ? '<span class="tier-badge">VIP</span>' : '') + '</div>' +
          '<div class="cell-sub">' + A.esc(preview(t.body)) + '</div></td>' +
        '<td>' + A.esc(LABEL[t.category] || t.category) + '</td>' +
        '<td>' + A.pill(t.status) + '</td>' +
        '<td class="right muted">' + A.ago(t.at) + '</td>' +
      '</tr>';
    });

    page.innerHTML = tabs() +
      A.card(rows.length + (view === 'open' ? ' waiting' : ' ' + view),
        A.table([
          { label: 'Customer' }, { label: 'About' }, { label: 'Status' },
          { label: 'Asked', right: true }
        ], list), '', true) +
      '<div class="foot-note">A ticket is one question and one answer. ' +
        'When a reply is sent the customer sees it on the support page, and ' +
        'anything further comes back as a new ticket.</div>';
    wire();
  }

  function wire() {
    page.addEventListener('click', function (e) {
      var tab = e.target.closest('[data-view]');
      if (tab) { view = tab.getAttribute('data-view'); load(); return; }
      var row = e.target.closest('[data-ticket]');
      if (row) open(row.getAttribute('data-ticket'));
    });
  }

  function open(id) {
    var t = rows.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    var answered = t.status !== 'open';

    A.openDrawer(
      '<div class="drawer-head">' +
        '<div style="flex:1"><h2>' + A.esc(LABEL[t.category] || t.category) + '</h2>' +
        '<p>' + A.esc(t.userName || 'Unnamed') + '</p></div>' +
        '<button class="iconbtn" data-close aria-label="Close">' + A.icon('close', 18) + '</button>' +
      '</div>' +
      '<div class="drawer-body">' +
        '<div><div class="sect-label">What they asked</div>' +
          '<div class="ticket-body">' + A.esc(t.body) + '</div></div>' +
        (t.reply
          ? '<div><div class="sect-label">The reply</div>' +
              '<div class="ticket-body">' + A.esc(t.reply) + '</div></div>'
          : '') +
        '<div><div class="sect-label">Account</div>' +
          '<div class="kv"><span>Email</span><b>' + A.esc(t.userEmail || '') + '</b></div>' +
          '<div class="kv"><span>Phone</span><b class="num">' +
            (t.userPhone ? '+' + A.esc(t.userPhone) : '') + '</b></div>' +
          '<div class="kv"><span>Tier</span><b>' + A.pill(t.userTier || 'standard') + '</b></div>' +
          '<div class="kv"><span>Asked</span><b>' + A.dateTime(t.at) + '</b></div>' +
        '</div>' +
        (answered ? '' :
          '<div class="field-block"><label for="tReply">Reply</label>' +
            '<div class="field"><textarea id="tReply" rows="5" ' +
              'placeholder="Answer the question they actually asked."></textarea></div>' +
            '<span class="hint">Sent to the customer as written, over the Novi support name.</span>' +
          '</div>') +
      '</div>' +
      (answered ? '' :
        '<div class="drawer-foot">' +
          '<button class="btn btn-primary btn-sm" data-act="reply">' +
            A.icon('check', 15) + 'Send reply</button>' +
          '<button class="btn btn-quiet btn-sm" data-act="close">Reply and close</button>' +
        '</div>'));

    var foot = document.querySelector('.drawer-foot');
    if (foot) foot.addEventListener('click', async function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var reply = ((document.getElementById('tReply') || {}).value || '').trim();
      if (reply.length < 2) {
        A.toast('Write the reply first');
        var box = document.getElementById('tReply');
        if (box) box.focus();
        return;
      }

      [].forEach.call(foot.querySelectorAll('button'), function (x) { x.disabled = true; });
      var label = b.textContent;
      b.innerHTML = A.loader('sm') + 'Sending';

      try {
        await A.data.replyTicket(t.id, reply, b.getAttribute('data-act') === 'close');
      } catch (err) {
        [].forEach.call(foot.querySelectorAll('button'), function (x) { x.disabled = false; });
        b.textContent = label;
        A.toast(err.message);
        return;
      }

      A.closeAll();
      await load();
      A.toast('Sent to ' + (t.userName || 'the customer'));
    });
  }

  load();
})();
</script>
</body>
</html>
