<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novi Admin, Deposits</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="payments" data-title="Deposits">
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/admin.js"></script>
<script>
(function () {
  var A = window.Admin;
  if (!A.mountChrome()) return;   /* not signed in */

  var page = document.getElementById('page');
  var state = { q: '', status: 'all', method: 'all', site: 'all',
                period: 'all', from: '', to: '' };

  /* The period buttons. Edges are worked out in this browser's clock, so
     "today" is the operator's day; the week starts on Monday. Custom takes
     two calendar dates and includes both of them. */
  var PERIODS = [['all', 'All time'], ['day', 'Today'], ['week', 'This week'],
                 ['month', 'This month'], ['custom', 'Custom']];
  function ymd(d) {
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function range() {
    var now = new Date();
    var start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (state.period === 'day') return { from: start };
    if (state.period === 'week') {
      start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
      return { from: start };
    }
    if (state.period === 'month') return { from: new Date(now.getFullYear(), now.getMonth(), 1) };
    if (state.period === 'custom') {
      var out = {};
      if (state.from) out.from = new Date(state.from + 'T00:00:00');
      if (state.to) { var t = new Date(state.to + 'T00:00:00'); t.setDate(t.getDate() + 1); out.to = t; }
      return out;
    }
    return {};
  }
  function periodLabel() {
    if (state.period === 'all') return 'all time';
    if (state.period === 'day') return 'today';
    if (state.period === 'week') return 'this week';
    if (state.period === 'month') return 'this month';
    if (state.from && state.to) return state.from + ' to ' + state.to;
    if (state.from) return 'since ' + state.from;
    if (state.to) return 'up to ' + state.to;
    return 'all time';
  }
  /* The sites that share this backend. Read from the Domains page, so a
     new site shows up here as soon as it is added there. The console's
     own host is not a site anyone pays through. */
  var SITES = [['all', 'Every site'], ['novibinary.com', 'Novi'], ['zenobinary.com', 'Zeno']];
  var siteTag = A.siteTag;
  Promise.resolve(A.data.domains ? A.data.domains() : []).then(function (list) {
    var hosts = (list || []).map(function (d) { return d.host; })
      .filter(function (h) { return h && !/^adminsite\./.test(h); });
    if (!hosts.length) return;
    SITES = [['all', 'Every site']].concat(hosts.map(function (h) { return [h, A.siteName(h)]; }));
    if (!loading) paint();
  }, function () {});
  var rows = [], total = 0, summary = null, loading = false, failure = null, timer = null;

  function search(value) {
    state.q = value;
    clearTimeout(timer);
    timer = setTimeout(load, A.data.live ? 300 : 0);
  }

  async function load() {
    loading = true; failure = null; paint();
    try {
      var out = await A.data.payments({
        q: state.q, status: state.status,
        method: state.method,
        site: state.site,
        from: range().from ? range().from.toISOString() : '',
        to: range().to ? range().to.toISOString() : '',
        provider: state.method === 'mpesa' ? 'payhero' :
                  state.method === 'card' ? 'paystack' : 'all'
      });
      rows = out.payments; total = out.total; summary = out.summary;
    } catch (err) {
      failure = err.message;
    }
    loading = false;
    paint();
  }

  function paint() {
    var settled = rows.filter(function (p) { return p.status === 'success'; });
    var gross = settled.reduce(function (a, p) { return a + p.amountMinor; }, 0);
    /* The server totals the whole period; the rows on screen are only
       the newest 120 of it. */
    var sumMinor = summary ? summary.collectedMinor : gross;
    var sumCount = summary ? summary.count : settled.length;
    var payers = summary && summary.depositors != null ? summary.depositors
      : new Set(settled.map(function (p) { return p.userEmail; })).size;
    var avg = sumCount ? Math.round(sumMinor / sumCount) : 0;
    var kpis = '<div class="kpis">' +
      A.kpi('Collected', A.shortMoney(sumMinor, 'KES'), periodLabel()) +
      A.kpi('Successful deposits', A.count(sumCount), periodLabel()) +
      A.kpi('Depositors', A.count(payers), 'different customers') +
      A.kpi('Average deposit', A.shortMoney(avg, 'KES'),
        summary && summary.largestMinor ? 'largest ' + A.shortMoney(summary.largestMinor, 'KES') : 'per deposit') +
    '</div>';

    function dropdown(id, label, options, current) {
      return '<label class="field">' +
        '<select id="' + id + '" aria-label="' + label + '">' +
          options.map(function (o) {
            return '<option value="' + A.esc(o[0]) + '"' + (current === o[0] ? ' selected' : '') + '>' +
              A.esc(o[1]) + '</option>';
          }).join('') +
        '</select></label>';
    }

    var filters = '<div class="filters">' +
      '<label class="field search-field">' + A.icon('search', 15) +
        '<input id="q" type="search" placeholder="Reference, name or email" value="' +
        A.esc(state.q) + '" aria-label="Search deposits"></label>' +
      dropdown('periodSel', 'Period', PERIODS, state.period) +
      (state.period === 'custom'
        ? '<label class="field"><input id="dFrom" type="date" value="' + A.esc(state.from) +
            '" max="' + ymd(new Date()) + '" aria-label="From"></label>' +
          '<span class="muted">to</span>' +
          '<label class="field"><input id="dTo" type="date" value="' + A.esc(state.to) +
            '" max="' + ymd(new Date()) + '" aria-label="To"></label>'
        : '') +
      dropdown('methodSel', 'Method', [['all', 'Every method'], ['mpesa', 'M-Pesa'], ['card', 'Card']], state.method) +
      dropdown('siteSel', 'Site', SITES, state.site) +
    '</div>';

    var body;
    if (loading) body = A.loadingBlock('Loading deposits');
    else if (failure) body = A.errorBlock(failure, 'retry');
    else if (!rows.length) body = A.emptyBlock('No deposits yet',
      state.q || state.method !== 'all' || state.site !== 'all' || state.period !== 'all'
        ? 'Nothing matches those filters.'
        : 'Every successful deposit shows here.');
    else body = A.table([
      { label: 'Reference' }, { label: 'Customer' }, { label: 'Site' }, { label: 'Method' },
      { label: 'Paid', right: true }, { label: 'Credited', right: true },
      { label: 'Status', right: true }, { label: 'When', right: true }
    ], rows.map(function (p) {
      return '<tr class="row-click" data-payment="' + A.esc(p.id) + '">' +
        '<td class="num">' + A.esc(p.reference) + '</td>' +
        '<td>' + A.who(p.userName, p.userEmail) + '</td>' +
        '<td>' + siteTag(p.site) + '</td>' +
        '<td>' + A.esc(p.providerLabel) + '</td>' +
        '<td class="num right">' + A.money(p.amountMinor, p.currency) + '</td>' +
        '<td class="num right">' +
          (p.creditedMinor == null ? '\u2014' : A.usd(p.creditedMinor)) + '</td>' +
        '<td class="right">' + A.pill(p.status) + '</td>' +
        '<td class="right muted">' + A.dateTime(p.created) + '</td>' +
      '</tr>';
    }));

    page.innerHTML = kpis + filters +
      A.card(loading ? 'Deposits' : rows.length + ' of ' + total + ' deposits', body, '', true);
    wire();
  }

  function wire() {
    var q = document.getElementById('q');
    if (q) q.addEventListener('input', function () {
      var at = this.selectionStart;
      search(this.value);
      var box = document.getElementById('q');
      if (box) { box.focus(); try { box.setSelectionRange(at, at); } catch (e) {} }
    });

    function onPick(id, apply) {
      var box = document.getElementById(id);
      if (box) box.addEventListener('change', function () { apply(this.value); load(); });
    }
    onPick('periodSel', function (v) {
      state.period = v;
      if (v === 'custom' && !state.from && !state.to) {
        /* Open on the last seven days rather than an empty pair of boxes. */
        var d = new Date(); state.to = ymd(d);
        d.setDate(d.getDate() - 6); state.from = ymd(d);
      }
    });
    onPick('methodSel', function (v) { state.method = v; });
    onPick('siteSel', function (v) { state.site = v; });
    ['dFrom', 'dTo'].forEach(function (id) {
      var box = document.getElementById(id);
      if (box) box.addEventListener('change', function () {
        state[id === 'dFrom' ? 'from' : 'to'] = this.value;
        if (state.from && state.to && state.from > state.to) {
          var t = state.from; state.from = state.to; state.to = t;
        }
        load();
      });
    });
    var retry = document.getElementById('retry');
    if (retry) retry.addEventListener('click', load);

    page.addEventListener('click', function (e) {
      var row = e.target.closest('[data-payment]');
      if (row) show(row.getAttribute('data-payment'));
    });
  }

  function show(id) {
    var p = rows.filter(function (x) { return x.id === id; })[0];
    if (!p) return;

    A.openDrawer(
      '<div class="drawer-head">' +
        '<div style="flex:1"><h2>' + A.money(p.amountMinor, p.currency) + '</h2>' +
        '<p>' + A.esc(p.reference) + '</p></div>' +
        '<button class="iconbtn" data-close aria-label="Close">' + A.icon('close', 18) + '</button>' +
      '</div>' +
      '<div class="drawer-body">' +
        '<div><div class="sect-label">Payment</div>' +
          '<div class="kv"><span>Status</span><b>' + A.pill(p.status) + '</b></div>' +
          '<div class="kv"><span>Site</span><b>' + siteTag(p.site) + ' ' + A.esc(p.site) + '</b></div>' +
          '<div class="kv"><span>Method</span><b>' + A.esc(p.providerLabel) + '</b></div>' +
          '<div class="kv"><span>Provider</span><b>' + A.esc(p.provider) + '</b></div>' +
          '<div class="kv"><span>Amount paid</span><b class="num">' +
            A.money(p.amountMinor, p.currency) + '</b></div>' +
          '<div class="kv"><span>Credited</span><b class="num">' +
            (p.creditedMinor == null ? 'Not credited' : A.usd(p.creditedMinor)) + '</b></div>' +
          '<div class="kv"><span>Started</span><b>' + A.dateTime(p.created) + '</b></div>' +
          /* The hash is the whole of the evidence on a chain transfer,
             and it is what gets pasted into an explorer. Shown in full
             and selectable rather than truncated for tidiness. */
          (p.txHash
            ? '<div class="kv"><span>Network</span><b>' + A.esc(p.network || 'TRC-20') + '</b></div>' +
              '<div><div class="sect-label">Transaction hash</div>' +
                '<div class="ticket-body num" style="word-break:break-all">' +
                  A.esc(p.txHash) + '</div>' +
                '<a class="btn btn-ghost btn-sm" style="margin-top:8px" target="_blank" ' +
                  'rel="noopener noreferrer" href="https://tronscan.org/#/transaction/' +
                  A.esc(p.txHash) + '">Open in Tronscan</a></div>'
            : '') +
          (p.failureReason
            ? '<div class="kv"><span>Reason</span><b>' + A.esc(p.failureReason) + '</b></div>' : '') +
        '</div>' +
        '<div><div class="sect-label">Customer</div>' +
          '<div class="kv"><span>Name</span><b>' + A.esc(p.userName) + '</b></div>' +
          '<div class="kv"><span>Email</span><b>' + A.esc(p.userEmail) + '</b></div>' +
        '</div>' +
      '</div>' +
      (p.status !== 'pending' ? '' :
        p.provider === 'usdt'
          /* There is no provider to ask about a chain transfer. Somebody
             looks at the hash and decides, which is why this button says
             what it does rather than "approve". */
          ? '<div class="drawer-foot">' +
              '<button class="btn btn-primary btn-sm" data-act="credit">' +
                A.icon('check', 15) + 'Confirmed on chain, credit it</button>' +
            '</div>'
          : '<div class="drawer-foot">' +
              '<button class="btn btn-primary btn-sm" data-act="recheck">' +
                'Ask the provider again</button>' +
            '</div>'));

    var foot = document.querySelector('.drawer-foot');
    if (foot) foot.addEventListener('click', async function (e) {
      var credit = e.target.closest('[data-act="credit"]');
      if (credit) {
        if (!confirm('Credit ' + A.usd(p.amountMinor) + ' to ' + (p.userName || 'this account') +
            '? Only do this once the transfer is confirmed on chain.')) return;
        credit.disabled = true;
        credit.innerHTML = A.loader('sm') + 'Crediting';
        try {
          await A.data.creditPayment(p.id);
          A.closeAll();
          await load();
          A.toast('Credited ' + A.usd(p.amountMinor));
        } catch (err) {
          credit.disabled = false;
          credit.textContent = 'Confirmed on chain, credit it';
          A.toast(err.message);
        }
        return;
      }

      var b = e.target.closest('[data-act="recheck"]');
      if (!b) return;
      b.disabled = true;
      b.innerHTML = A.loader('sm') + 'Checking';
      try {
        var fresh = await A.data.recheckPayment(p.id);
        A.closeAll();
        await load();
        A.toast(fresh && fresh.status !== 'pending'
          ? 'Provider says: ' + fresh.status
          : 'Still pending at the provider');
      } catch (err) {
        b.disabled = false;
        b.textContent = 'Ask the provider again';
        A.toast(err.message);
      }
    });
  }

  load();
})();
</script>
</body>
</html>
